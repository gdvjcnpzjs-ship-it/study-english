<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phrase Randomizer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- iPhone Web Clip Icon（JavaScriptでDynamic PNG化して適用） -->
  <link id="apple-icon" rel="apple-touch-icon">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #f0f7f4;
      --card-bg: #ffffff;
      --text-main: #2d4030;
      --accent-green: #52b788;
      --accent-hover: #40916c;
      --light-green: #e8f5e9;
      --border-color: #b7e4c7;
      --font-main: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body { 
      font-family: var(--font-main); 
      max-width: 600px; 
      margin: 0 auto; 
      padding: 20px 15px; 
      text-align: center; 
      background: var(--bg-color); 
      color: var(--text-main); 
      width: 100%;
      overflow-x: hidden;
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--accent-hover);
      margin-top: 10px;
      margin-bottom: 20px;
    }

    /* Goal Meter */
    .goal-container { 
      background: var(--card-bg); 
      padding: 15px; 
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px; 
      box-shadow: 0 4px 12px rgba(82, 183, 136, 0.1);
      width: 100%;
    }
    .goal-header { 
      display: flex; 
      justify-content: space-between; 
      font-size: 1rem; 
      font-weight: 600; 
      margin-bottom: 8px; 
    }
    .progress-bar-bg { 
      background: var(--light-green); 
      height: 12px; 
      border-radius: 6px;
      overflow: hidden; 
    }
    .progress-bar-fill { 
      background: var(--accent-green); 
      height: 100%; 
      width: 0%; 
      transition: width 0.3s ease;
    }
    .cleared-msg { 
      font-size: 0.95rem; 
      font-weight: 600;
      color: var(--accent-hover); 
      margin-top: 6px; 
      display: none;
    }

    /* Config Panel */
    .settings-panel {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 15px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
      box-shadow: 0 4px 12px rgba(82, 183, 136, 0.1);
      width: 100%;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .setting-row label {
      font-size: 0.95rem;
      font-weight: 600;
    }
    .settings-panel input[type="number"] {
      background: var(--light-green);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: var(--font-main);
      font-size: 0.95rem;
    }
    .settings-panel input[type="range"] {
      accent-color: var(--accent-green);
    }

    /* Display Card */
    .card { 
      background: var(--card-bg); 
      border-radius: 12px;
      border: 1px solid var(--border-color); 
      padding: 25px 20px; 
      margin-bottom: 20px; 
      min-height: 120px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 4px 12px rgba(82, 183, 136, 0.1);
      width: 100%;
    }
    .phrase { 
      font-size: 1.3rem; 
      font-weight: 600; 
      color: var(--text-main);
      word-break: break-word; 
    }

    /* Buttons */
    .btn-group { 
      display: flex; 
      gap: 8px; 
      justify-content: center; 
      flex-wrap: wrap; 
      margin-bottom: 20px; 
      width: 100%;
    }
    button { 
      padding: 10px 16px; 
      border: none;
      border-radius: 20px;
      background: var(--accent-green); 
      color: #ffffff; 
      font-family: var(--font-main);
      font-size: 0.95rem; 
      font-weight: 500;
      cursor: pointer; 
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    button:hover { 
      background: var(--accent-hover);
    }
    button.active { 
      background: #e63946; 
      color: #fff;
    }

    /* Inputs */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 100%;
    }
    input[type="text"] { 
      flex: 1;
      min-width: 0;
      padding: 10px 14px; 
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border-color); 
      border-radius: 20px;
      font-family: var(--font-main);
      font-size: 0.95rem; 
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-green);
    }
    .input-group button {
      flex-shrink: 0;
      padding: 10px 20px;
    }
    
    /* List & Data Management */
    .management-section {
      margin-top: 30px;
      border-top: 1px dashed var(--border-color);
      padding-top: 20px;
      text-align: left;
      width: 100%;
    }
    .management-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 1rem;
      font-weight: 600;
    }
    .data-btns {
      display: flex;
      gap: 6px;
    }
    .data-btns button {
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 14px;
    }
    .phrase-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      background: #ffffff;
      width: 100%;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--light-green);
      font-size: 0.9rem;
    }
    .list-item:last-child {
      border-bottom: none;
    }
    .delete-btn {
      background: #e63946;
      color: #fff;
      padding: 4px 10px;
      font-size: 0.8rem;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .delete-btn:hover {
      background: #c1121f;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--light-green); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
  </style>
</head>
<body>

  <h2>Phrase Randomizer</h2>

  <div class="goal-container">
    <div class="goal-header">
      <span>Daily Upload</span>
      <span id="goalCount">0 / 3</span>
    </div>
    <div class="progress-bar-bg">
      <div id="progressFill" class="progress-bar-fill"></div>
    </div>
    <div id="clearedMsg" class="cleared-msg">Upload Complete. System Ready.</div>
  </div>

  <div class="settings-panel">
    <div class="setting-row">
      <label for="repeatCount">Repeat Count:</label>
      <input type="number" id="repeatCount" value="3" min="1" max="10" style="width: 50px;" onchange="saveSettings()">
    </div>
    <div class="setting-row">
      <label for="speechRate">Speed (<span id="rateVal">1.0x</span>):</label>
      <input type="range" id="speechRate" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateRateLabel()" onchange="saveSettings()">
    </div>
  </div>

  <div class="card">
    <div id="display" class="phrase">No Data Found</div>
  </div>

  <div class="btn-group">
    <button onclick="nextPhrase(false)">Next</button>
    <button onclick="playCurrentSingle()">Play</button>
    <button onclick="copyPhrase()">Copy</button>
    <button id="autoBtn" onclick="toggleAutoPlay()">Auto Play</button>
  </div>

  <div class="input-group">
    <input type="text" id="inputPhrase" placeholder="Enter new phrase...">
    <button onclick="addPhrase()">Add</button>
  </div>

  <div class="management-section">
    <div class="management-header">
      <span>Database [<span id="totalCount">0</span>]</span>
      <div class="data-btns">
        <button onclick="exportData()">Export</button>
        <button onclick="document.getElementById('importFile').click()">Import</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
      </div>
    </div>
    <div id="phraseList" class="phrase-list"></div>
  </div>

  <script>
    function generateAppleIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#a8e6cf';
      ctx.fillRect(0, 0, 180, 180);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(39.6, 86.4);
      ctx.lineTo(140.4, 39.6);
      ctx.lineTo(93.6, 140.4);
      ctx.lineTo(75.6, 100.8);
      ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(75.6, 100.8);
      ctx.lineTo(140.4, 39.6);
      ctx.stroke();

      document.getElementById('apple-icon').href = canvas.toDataURL('image/png');
    }

    generateAppleIcon();

    let phrases = JSON.parse(localStorage.getItem('my_phrases')) || [];
    let remainingPhrases = []; 
    let current = "";
    let autoTimer = null;
    let isAutoPlaying = false;
    const DAILY_GOAL = 3;

    // Fisher-Yates アルゴリズムによるシャッフル
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function saveSettings() {
      const repeatVal = document.getElementById('repeatCount').value;
      const rateVal = document.getElementById('speechRate').value;
      localStorage.setItem('setting_repeat_count', repeatVal);
      localStorage.setItem('setting_speech_rate', rateVal);
    }

    function loadSettings() {
      const savedRepeat = localStorage.getItem('setting_repeat_count');
      const savedRate = localStorage.getItem('setting_speech_rate');

      if (savedRepeat !== null) document.getElementById('repeatCount').value = savedRepeat;
      if (savedRate !== null) document.getElementById('speechRate').value = savedRate;
      updateRateLabel();
    }

    function updateRateLabel() {
      const val = document.getElementById('speechRate').value;
      document.getElementById('rateVal').innerText = val + 'x';
    }

    function save() {
      localStorage.setItem('my_phrases', JSON.stringify(phrases));
      updateListUI();
    }

    function getTodayKey() {
      const today = new Date();
      return `added_${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
    }

    function updateGoalMeter(increment = 0) {
      const todayKey = getTodayKey();
      let count = parseInt(localStorage.getItem(todayKey) || '0', 10);
      
      if (increment > 0) {
        count += increment;
        localStorage.setItem(todayKey, count);
      }

      const percent = Math.min((count / DAILY_GOAL) * 100, 100);
      document.getElementById('goalCount').innerText = `${count} / ${DAILY_GOAL}`;
      document.getElementById('progressFill').style.width = `${percent}%`;

      if (count >= DAILY_GOAL) {
        document.getElementById('clearedMsg').style.display = 'block';
      }
    }

    function updateListUI() {
      document.getElementById('totalCount').innerText = phrases.length;
      const listContainer = document.getElementById('phraseList');
      listContainer.innerHTML = '';
      
      if (phrases.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; color:#52b788; padding:20px;">No Data</div>';
        return;
      }

      phrases.forEach((phrase, index) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        
        const textSpan = document.createElement('span');
        textSpan.innerText = phrase;
        textSpan.style.marginRight = '10px';
        textSpan.style.wordBreak = 'break-all';
        
        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.innerText = 'Del';
        delBtn.onclick = () => deletePhrase(index);
        
        item.appendChild(textSpan);
        item.appendChild(delBtn);
        listContainer.appendChild(item);
      });
    }

    function speakPhraseRepeat(text, repeatCount, onComplete) {
      let count = 0;
      const rate = parseFloat(document.getElementById('speechRate').value) || 1.0;

      function playOnce() {
        if (count >= repeatCount) {
          if (onComplete) onComplete();
          return;
        }

        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'en-US';
        uttr.rate = rate;

        uttr.onend = function() {
          count++;
          if (count < repeatCount) {
            setTimeout(playOnce, 1200);
          } else if (onComplete) {
            onComplete();
          }
        };

        uttr.onerror = function() {
          if (onComplete) onComplete();
        };

        speechSynthesis.speak(uttr);
      }

      playOnce();
    }

    function playCurrentSingle() {
      if (!current) return;
      speechSynthesis.cancel();
      if (isAutoPlaying) toggleAutoPlay();

      const repeats = parseInt(document.getElementById('repeatCount').value, 10) || 3;
      speakPhraseRepeat(current, repeats);
    }

    // 一巡シャッフル表示処理
    function nextPhrase(shouldSpeak = false) {
      if (phrases.length === 0) {
        document.getElementById('display').innerText = "No Data Found";
        current = "";
        remainingPhrases = [];
        return;
      }
      
      // 未表示フレーズが無くなったら、全体をシャッフルしてキューをリセット
      if (remainingPhrases.length === 0) {
        remainingPhrases = shuffleArray(phrases);

        // 新しい一巡の最初が、前回の一巡の最後と同じフレーズになった場合の調整
        if (remainingPhrases.length > 1 && remainingPhrases[remainingPhrases.length - 1] === current) {
          const duplicate = remainingPhrases.pop();
          remainingPhrases.unshift(duplicate);
        }
      }

      current = remainingPhrases.pop();
      document.getElementById('display').innerText = current;

      if (shouldSpeak) {
        speakAndNext();
      }
    }

    function speakAndNext() {
      if (!current || !isAutoPlaying) return;

      speechSynthesis.cancel();
      const repeats = parseInt(document.getElementById('repeatCount').value, 10) || 3;

      speakPhraseRepeat(current, repeats, () => {
        if (!isAutoPlaying) return;
        autoTimer = setTimeout(() => {
          nextPhrase(false);
          speakAndNext();
        }, 1500);
      });
    }

    function toggleAutoPlay() {
      const btn = document.getElementById('autoBtn');
      if (isAutoPlaying) {
        isAutoPlaying = false;
        clearTimeout(autoTimer);
        speechSynthesis.cancel();
        btn.innerText = "Auto Play";
        btn.classList.remove('active');
      } else {
        isAutoPlaying = true;
        btn.innerText = "Stop";
        btn.classList.add('active');
        if (!current) nextPhrase(false);
        speakAndNext();
      }
    }

    function copyPhrase() {
      if (!current) return;
      navigator.clipboard.writeText(current);
      const display = document.getElementById('display');
      const originalText = display.innerText;
      display.innerText = "Data Copied";
      setTimeout(() => { display.innerText = originalText; }, 1000);
    }

    function addPhrase() {
      const input = document.getElementById('inputPhrase');
      const text = input.value.trim();
      if (text) {
        phrases.push(text);
        save();
        updateGoalMeter(1);
        input.value = '';
        
        // 新しいフレーズを未表示の山にも追加
        remainingPhrases.unshift(text);

        if (!current) nextPhrase(false);
      }
    }

    function deletePhrase(index) {
      if (confirm("Delete Data?")) {
        const deletedText = phrases[index];
        phrases.splice(index, 1);
        
        // 未表示の山からも削除されたフレーズをクリア
        remainingPhrases = remainingPhrases.filter(item => item !== deletedText);
        
        save();
        if (phrases.length === 0) {
          current = "";
          document.getElementById('display').innerText = "No Data Found";
        } else if (current === deletedText) {
          nextPhrase(false);
        }
      }
    }

    function exportData() {
      if (phrases.length === 0) {
        alert("No Data To Export");
        return;
      }
      const dataStr = JSON.stringify(phrases, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "phrases_backup.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedPhrases = JSON.parse(e.target.result);
          if (Array.isArray(importedPhrases)) {
            phrases = [...new Set([...phrases, ...importedPhrases])];
            save();
            remainingPhrases = shuffleArray(phrases);
            alert("Import Successful");
            if (!current) nextPhrase(false);
          } else {
            alert("Invalid Format");
          }
        } catch (err) {
          alert("Error Parsing File");
        }
        document.getElementById('importFile').value = '';
      };
      reader.readAsText(file);
    }

    // Initialize
    loadSettings();
    updateGoalMeter(0);
    updateListUI();
    nextPhrase(false);

    document.getElementById("inputPhrase").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        addPhrase();
      }
    });
  </script>
</body>
</html>
